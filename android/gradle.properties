# Sized for a machine that also runs an emulator and an IDE. The previous
# 8G heap + 4G metaspace asked for more than is free, so the daemon swapped
# and builds crawled. -Xmx is a ceiling, not a reservation.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Reuse task outputs between builds instead of redoing them.
org.gradle.caching=true
# Generate only this module's R fields, which speeds up resource processing.
android.nonTransitiveRClass=true
